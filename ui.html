<div class="top-bar">
    <div class="header-row">
        <h3>✨ VG Tools</h3>
        <button id="refreshUiBtn" class="refresh-btn" title="Fetch latest UI & scripts from GitHub">↻ Refresh UI</button>
    </div>
    <select id="viewSelector" class="view-dropdown"></select>

    <!-- Live JSX Progress Bar -->
    <div id="progressWrap" class="progress-wrap">
        <div class="progress-meta">
            <span id="progressText">Ready</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </div>
</div>

<!-- Dynamic HTML views load here -->
<div id="view-container"></div>

<div class="footer-info">
    <div class="info">✨ Designed & Developed by VG!</div>
    <div id="lastUpdatedText" class="last-updated">Syncing...</div>
</div>

<!-- Persistent Selectable Activity Log (Bottom of Panel) -->
<div id="vgLogPanel" class="log-panel">
    <div id="vgLogResizer" class="log-resizer" title="Drag to resize log"></div>
    <div class="log-header">
        <span class="log-title">Activity Log</span>
        <div class="log-actions">
            <button id="vgLogCopyBtn" class="log-btn" title="Copy all log history">Copy</button>
            <button id="vgLogClearBtn" class="log-btn" title="Clear log">Clear</button>
            <button id="vgLogToggleBtn" class="log-btn" title="Collapse/Expand">▼</button>
        </div>
    </div>
    <div id="vgLogBox" class="log-box"></div>
</div>
