<div class="top-bar">
    <h3>✨ VG Tools ✨</h3>
    <input type="text" id="messageInput" placeholder="Input values here..." />
</div>

<div id="sections">
    <!-- TEXT TOOLS -->
    <div class="accordion">
        <button class="accordion-header active">
            Text Tools
            <span class="accordion-icon">▼</span>
        </button>

        <div class="accordion-content" style="max-height: 200px;">
            <div class="button-sub layout-column">
                <button class="tool-btn">Align+Spacing Text</button>
                <button class="tool-btn">Join Text</button>
            </div>
        </div>
    </div>

    <!-- MAIN TOOLS -->
    <div class="accordion">
        <button class="accordion-header">
            Main Tools
            <span class="accordion-icon">▼</span>
        </button>

        <div class="accordion-content">
            <div class="button-sub layout-row">
                <button class="tool-btn">Crop & Ungroup</button>
                <button class="tool-btn">Say Hello from JSX</button>
            </div>
        </div>
    </div>

    <!-- EXTRA TOOLS -->
    <div class="accordion">
        <button class="accordion-header">
            Extra Tools
            <span class="accordion-icon">▼</span>
        </button>

        <div class="accordion-content">
            <div class="button-sub layout-column">
                <button class="tool-btn">Welcome To VG Tools</button>

            </div>
        </div>
    </div>

</div>

<div class="info">
    ✨ Designed & Developed by VG!
</div>

<script>
var headers = document.getElementsByClassName("accordion-header");

for (var i = 0; i < headers.length; i++) {

    headers[i].addEventListener("click", function () {

        var content = this.nextElementSibling;
        var isActive = this.classList.contains("active");

        // Close all accordions
        for (var j = 0; j < headers.length; j++) {
            headers[j].classList.remove("active");
            headers[j].nextElementSibling.style.maxHeight = null;
        }

        // Open current
        if (!isActive) {
            this.classList.add("active");
            content.style.maxHeight = content.scrollHeight + "px";
        }
    });

}
</script>
