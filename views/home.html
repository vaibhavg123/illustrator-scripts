<!-- Hide Graphic Options -->
<div class="accordion" id="hideGraphicsAccordion">
    <div class="accordion-header active" id="hideGraphicsHeader">
        <span>Hide Graphic Options</span>
        <span class="accordion-icon">▼</span>
    </div>

    <div class="accordion" id="templateToolAccordion">
    <div class="accordion-header" id="templateToolHeader">
        <span>Template Tool (Test)</span>
        <span class="accordion-icon">▼</span>
    </div>

    <div class="accordion-content" id="templateToolContent" style="max-height: 0px;">
        <div class="hide-options-body">
            <label class="field-label" for="templateCountInput">Step Count</label>
            <input type="number" id="templateCountInput" class="custom-input" value="3" min="1" max="50" />

            <label class="field-label" for="templateModeSelect">Mode</label>
            <select id="templateModeSelect" class="view-dropdown">
                <option value="default" selected>Default</option>
                <option value="fast">Fast</option>
                <option value="detailed">Detailed</option>
            </select>

            <button id="btnTemplateRun" class="tool-btn">Run Template Tool</button>
        </div>
    </div>
</div>

    <div class="accordion-content" id="hideGraphicsContent" style="max-height: 400px;">
        <div class="hide-options-body">
            <label class="checkbox-row">
                <input type="checkbox" id="chkHideFill" checked />
                <span>Hide Fill (Paths &amp; Compound Paths)</span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="chkHideText" />
                <span>Hide Texts (Text Frames)</span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="chkHideDashed" />
                <span>Hide Dashed Lines</span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="chkHideOnlyLines" />
                <span>Hide Only Lines (Open or Unfilled Strokes)</span>
            </label>

            <div class="action-btn-row">
                <button id="btnRunHideGraphics" class="tool-btn">Hide Selected</button>
                <button id="btnUnhideAll" class="tool-btn secondary">Unhide All</button>
            </div>
        </div>
    </div>
</div>

<!-- Dynamic sections & buttons from version.json -->
<div id="sections"></div>
<div id="buttons"></div>
