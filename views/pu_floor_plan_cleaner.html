<!-- views/layer_organizer.html -->
<div class="custom-card">
    <div id="loTabBar" style="display:flex; gap:6px; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.12); padding-bottom:6px;">
        <button type="button" id="loTabClean" class="tool-btn" data-tab="clean" style="flex:1; padding:6px 8px; font-size:11px;">
            Auto Clean PDF File
        </button>
        <button type="button" id="loTabScale" class="tool-btn secondary" data-tab="scale" style="flex:1; padding:6px 8px; font-size:11px;">
            Scale percentage calculator
        </button>
    </div>

    <!-- TAB 1: AUTO CLEAN PDF FILE -->
    <div id="loPanelClean" data-tab-panel="clean">
        <h4>Auto Clean PDF File</h4>
        <p style="font-size:11px; color:#9fb0c3; margin:0 0 8px 0;">
            First release all - Clipping mask, compound path, path-Clean UP and Ungroup
        </p>
        <div style="display:none;">
            <label class="checkbox-row">
                <input type="checkbox" id="loChkText" checked />
                <span>1. Move Text Frames → <b>text</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkWhiteFill" checked />
                <span>2. Move #FFFFFF Fill Graphics → <b>white_fill</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkFill" checked />
                <span>3. Move Filled Paths → <b>fill</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkZeroSize" checked />
                <span>4. Move Zero-Size Objects → <b>zero_size</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkStroke" checked />
                <span>5. Move Zero-Stroke Paths → <b>stroke</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkDashed" checked />
                <span>6. Move Dashed Lines → <b>dashed</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkLine" checked />
                <span>7. Move Remaining Graphics → <b>lines</b></span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="loChkReorder" checked />
                <span>8. Reorder Layers (text → white_fill → fill → dashed → lines → stroke → zero_size)</span>
            </label>
        </div>
        <button type="button" id="loBtnRun" class="tool-btn">▶ Start File Cleaning</button>
        <p style="font-size:11px; color:#9fb0c3; margin:6px 0 0 0;">
            Moves #FFFFFF fills to <b>white_fill</b> and orders layers top-to-bottom.
        </p>
    </div>

    <!-- TAB 2: SCALE PERCENTAGE CALCULATOR -->
    <div id="loPanelScale" data-tab-panel="scale" style="display:none;">
        <h4>Scale percentage calculator</h4>

        <div style="margin-bottom:8px;">
            <label for="loInput1" style="display:block; font-size:11px; color:#9fb0c3; margin-bottom:4px;">
                Input 1 — Selected Line Width/Height (in)
            </label>
            <div style="display:flex; gap:6px;">
                <input type="text" inputmode="decimal" id="loInput1" placeholder="e.g. 0.9683"
                       style="flex:1; padding:5px 7px; font-size:12px;" />
                <button type="button" id="loBtnFetch" class="tool-btn secondary" style="white-space:nowrap;">
                    Fetch
                </button>
            </div>
        </div>

        <div style="margin-bottom:8px;">
            <label for="loInput2" style="display:block; font-size:11px; color:#9fb0c3; margin-bottom:4px;">
                Input 2 — Target Dimension (e.g. 10.3, 12.1, 11.2)
            </label>
            <input type="text" inputmode="decimal" id="loInput2" placeholder="e.g. 10.3"
                   style="width:100%; box-sizing:border-box; padding:5px 7px; font-size:12px;" />
        </div>

        <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:4px; padding:7px 8px; margin-bottom:8px;">
            <div style="font-size:11px; color:#9fb0c3;" id="loCalcSteps">
                (Input 2 × 9.733) ÷ Input 1
            </div>
            <div style="font-size:14px; font-weight:bold; margin-top:2px;" id="loScaleOutput">
                —%
            </div>
        </div>

        <button type="button" id="loBtnCopy" class="tool-btn secondary" style="width:100%;">
            Copy %
        </button>
    </div>
</div>

<div class="action-btn-row" style="margin-top:10px;">
    <button type="button" class="tool-btn secondary" data-jsx="jsx/create.jsx">+ Create Layers</button>
</div>

<script>
(function () {
    var JSX_PATH = "jsx/pu_floor_plan_cleaner.jsx";
    var STORAGE_KEY = "vg_layer_organizer_opts";
    var TAB_STORAGE_KEY = "vg_layer_organizer_active_tab";
    var SCALE_FACTOR = 9.733;
    var latestPctNumber = "";

    var ids = ["loChkText", "loChkWhiteFill", "loChkFill", "loChkZeroSize", "loChkStroke", "loChkDashed", "loChkLine", "loChkReorder"];

    var tabCleanBtn = document.getElementById("loTabClean");
    var tabScaleBtn = document.getElementById("loTabScale");
    var panelClean = document.getElementById("loPanelClean");
    var panelScale = document.getElementById("loPanelScale");

    var input1El = document.getElementById("loInput1");
    var input2El = document.getElementById("loInput2");
    var fetchBtn = document.getElementById("loBtnFetch");
    var copyBtn = document.getElementById("loBtnCopy");
    var stepsEl = document.getElementById("loCalcSteps");
    var outputEl = document.getElementById("loScaleOutput");

    function setActiveTab(tabName) {
        var isScale = (tabName === "scale");
        panelClean.style.display = isScale ? "none" : "block";
        panelScale.style.display = isScale ? "block" : "none";

        tabCleanBtn.className = isScale ? "tool-btn secondary" : "tool-btn";
        tabScaleBtn.className = isScale ? "tool-btn" : "tool-btn secondary";

        try { localStorage.setItem(TAB_STORAGE_KEY, isScale ? "scale" : "clean"); } catch (e) {}
    }

    if (tabCleanBtn) {
        tabCleanBtn.onclick = function () { setActiveTab("clean"); };
    }
    if (tabScaleBtn) {
        tabScaleBtn.onclick = function () { setActiveTab("scale"); };
    }

    function logMsg(msg, level) {
        if (window.VGTools && typeof window.VGTools.log === "function") {
            window.VGTools.log(msg, level || "info");
        }
    }

    function invokeJsx(payload, onDone) {
        function finish(res) {
            if (typeof onDone === "function") onDone(res);
        }

        if (window.VGTools && typeof window.VGTools.runScript === "function") {
            var calledDone = false;
            try {
                var ret = window.VGTools.runScript(
                    JSX_PATH,
                    payload,
                    function (res) {
                        if (!calledDone) {
                            calledDone = true;
                            finish(res);
                        }
                    },
                    payload.action === "getSelectedSize" ? "Fetch Selected Size" : "Layer Organizer"
                );
                if (ret && typeof ret.then === "function") {
                    ret.then(function (r) {
                        if (!calledDone) {
                            calledDone = true;
                            finish(r);
                        }
                    }).catch(function () {
                        if (!calledDone) {
                            calledDone = true;
                            finish(null);
                        }
                    });
                }
            } catch (e) {
                if (!calledDone) {
                    calledDone = true;
                    finish(null);
                }
            }
        } else {
            finish(null);
        }
    }

    function cleanNumberInput(raw) {
        if (!raw) return "";
        var stripped = String(raw).replace(/[^0-9.]/g, "");
        var firstDot = stripped.indexOf(".");
        if (firstDot !== -1) {
            stripped = stripped.slice(0, firstDot + 1) + stripped.slice(firstDot + 1).replace(/\./g, "");
        }
        return stripped;
    }

    function extractJsonPayload(res) {
        if (!res) return null;
        if (typeof res === "object") return res;
        if (typeof res === "string") {
            try { return JSON.parse(res); } catch (e) {}
            var match = res.match(/\{[\s\S]*"ok"[\s\S]*\}/);
            if (match) {
                try { return JSON.parse(match[0]); } catch (e2) {}
            }
        }
        return null;
    }

    function saveOpts() {
        var data = {};
        for (var i = 0; i < ids.length; i++) {
            var el = document.getElementById(ids[i]);
            if (el) data[ids[i]] = el.checked;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function loadOpts() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            var data = JSON.parse(raw);
            for (var i = 0; i < ids.length; i++) {
                var el = document.getElementById(ids[i]);
                if (el && typeof data[ids[i]] === "boolean") el.checked = data[ids[i]];
            }
        } catch (e) {}
    }

    function loadSavedTab() {
        try {
            var savedTab = localStorage.getItem(TAB_STORAGE_KEY);
            if (savedTab === "scale" || savedTab === "clean") {
                setActiveTab(savedTab);
                return;
            }
        } catch (e) {}
        setActiveTab("clean");
    }

    function calculateScale() {
        var clean1 = cleanNumberInput(input1El.value);
        var clean2 = cleanNumberInput(input2El.value);

        if (input1El.value !== clean1) input1El.value = clean1;
        if (input2El.value !== clean2) input2El.value = clean2;

        var v1 = parseFloat(clean1);
        var v2 = parseFloat(clean2);

        if (isNaN(v1) || isNaN(v2) || v1 === 0) {
            stepsEl.textContent = "(Input 2 × 9.733) ÷ Input 1";
            outputEl.textContent = "—%";
            latestPctNumber = "";
            return;
        }

        var numerator = v2 * SCALE_FACTOR;
        var pctVal = Number((numerator / v1).toFixed(4));
        var pctNumStr = String(pctVal);

        stepsEl.textContent =
            v2 + " × " + SCALE_FACTOR + " = " + Number(numerator.toFixed(4)) +
            " ÷ " + v1 + " = " + pctNumStr + "%";
        outputEl.textContent = pctNumStr + "%";
        latestPctNumber = pctNumStr;
    }

    [input1El, input2El].forEach(function (el) {
        if (!el) return;
        el.addEventListener("input", calculateScale);
        el.addEventListener("paste", function () {
            setTimeout(calculateScale, 0);
        });
        el.addEventListener("change", calculateScale);
    });

    if (fetchBtn) {
        fetchBtn.onclick = function () {
            fetchBtn.disabled = true;
            invokeJsx(
                { _fromHtmlUi: true, action: "getSelectedSize" },
                function (rawRes) {
                    fetchBtn.disabled = false;
                    var parsed = extractJsonPayload(rawRes);
                    if (parsed && parsed.ok && typeof parsed.inches === "number") {
                        input1El.value = cleanNumberInput(String(parsed.inches));
                        calculateScale();
                        var axisLabel = parsed.orientation === "vertical" ? "height" : "width";
                        logMsg("Fetched " + axisLabel + ": " + parsed.inches + " in", "info");
                    } else {
                        logMsg((parsed && parsed.error) || "Select a line in Illustrator and click Fetch.", "warn");
                    }
                }
            );
        };
    }

    if (copyBtn) {
        copyBtn.onclick = function () {
            if (!latestPctNumber) {
                logMsg("Nothing to copy yet.", "warn");
                return;
            }
            if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
                navigator.clipboard.writeText(latestPctNumber).then(function () {
                    logMsg("Copied: " + latestPctNumber, "info");
                }).catch(function () {
                    fallbackCopy(latestPctNumber);
                });
            } else {
                fallbackCopy(latestPctNumber);
            }
        };
    }

    function fallbackCopy(text) {
        var temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        try {
            document.execCommand("copy");
            logMsg("Copied: " + text, "info");
        } catch (e) {
            logMsg("Copy failed.", "warn");
        }
        document.body.removeChild(temp);
    }

    for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el) el.addEventListener("change", saveOpts);
    }

    var runBtn = document.getElementById("loBtnRun");
    if (runBtn) {
        runBtn.onclick = function () {
            var payload = {
                _fromHtmlUi: true,
                runText: document.getElementById("loChkText").checked,
                runWhiteFill: document.getElementById("loChkWhiteFill").checked,
                runFill: document.getElementById("loChkFill").checked,
                runZeroSize: document.getElementById("loChkZeroSize").checked,
                runStroke: document.getElementById("loChkStroke").checked,
                runDashed: document.getElementById("loChkDashed").checked,
                runLine: document.getElementById("loChkLine").checked,
                runReorder: document.getElementById("loChkReorder").checked
            };

            if (!payload.runText && !payload.runWhiteFill && !payload.runFill &&
                !payload.runZeroSize && !payload.runStroke && !payload.runDashed &&
                !payload.runLine && !payload.runReorder) {
                logMsg("Layer Organizer -> Please check at least one step.", "warn");
                return;
            }

            saveOpts();
            runBtn.disabled = true;
            runBtn.innerText = "Organizing...";

            invokeJsx(payload, function (rawRes) {
                runBtn.disabled = false;
                runBtn.innerText = "▶ Start File Cleaning";
                var parsed = extractJsonPayload(rawRes);
                if (parsed && parsed.ok) {
                    logMsg("File cleaning completed.", "info");
                }
            });
        };
    }

    loadOpts();
    loadSavedTab();
    calculateScale();
})();
</script>
